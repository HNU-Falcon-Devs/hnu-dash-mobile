name: M2.4 temporary formatting and lockfile generator
on:
  push:
    branches: [feat/m2-4-staff-workspace]
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter stable
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: Generate and print deterministic files
        run: |
          flutter pub get
          dart format lib/main.dart lib/staff_workspace.dart test/widget_test.dart
          python3 - <<'PY'
          import base64
          for path in ['lib/main.dart', 'lib/staff_workspace.dart', 'test/widget_test.dart', 'pubspec.lock']:
              print('FILE_BEGIN:'+path)
              with open(path, 'rb') as f: print(base64.b64encode(f.read()).decode('ascii'))
              print('FILE_END:'+path)
          PY
