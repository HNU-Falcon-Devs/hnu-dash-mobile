name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter stable
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Diagnose Dart formatting (temporary)
        if: failure()
        run: |
          for file in lib/scan_ingestion.dart test/scan_ingestion_test.dart test/scan_rpc_authorization_test.dart test/secure_attendance_store_test.dart; do
            dart format --output=show "$file" > /tmp/formatted.dart
            diff -u "$file" /tmp/formatted.dart || true
          done
      - name: Analyze
        run: flutter analyze
      - name: Install SQLite library for persistence tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev
      - name: Test
        run: flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Verify SQLCipher native libraries in APK
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          import tempfile
          import zipfile

          apk = "build/app/outputs/flutter-apk/app-debug.apk"
          with zipfile.ZipFile(apk) as archive:
              names = archive.namelist()
              libraries = [
                  name for name in names
                  if name.startswith("lib/") and name.endswith("/libsqlcipher.so")
              ]
              if not libraries:
                  raise SystemExit("SQLCipher libsqlcipher.so is missing from the APK")
              if not any(name.startswith("lib/arm64-v8a/") for name in libraries):
                  raise SystemExit("The Android arm64 SQLCipher library is missing")

              for name in libraries:
                  binary = archive.read(name)
                  markers = (b"cipher_version", b"sqlite3_key", b"SQLCipher")
                  if not any(marker in binary for marker in markers):
                      raise SystemExit(f"{name} has no recognizable SQLCipher marker")

                  with tempfile.NamedTemporaryFile() as target:
                      target.write(binary)
                      target.flush()
                      result = subprocess.run(
                          ["readelf", "-d", target.name],
                          check=True, capture_output=True, text=True
                      )
                  needed = re.findall(r"Shared library: \[(.*?)\]", result.stdout)
                  if any("libcrypto.so" in item for item in needed):
                      bundled_crypto = any(
                          item.startswith("lib/") and item.endswith("/libcrypto.so")
                          for item in names
                      )
                      if not bundled_crypto:
                          raise SystemExit(
                              f"{name} requires libcrypto.so but the APK does not bundle it"
                          )

              print("Verified SQLCipher Android libraries:")
              for name in libraries:
                  print(f" - {name}")
          PY
