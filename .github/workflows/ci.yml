name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository contents
        shell: bash
        run: |
          test -s README.md
          test "$(cat .github/CODEOWNERS)" = '* @Syris-EkzD'
          test "$(find . -type f -not -path './.git/*' | sort | wc -l)" -eq 3
