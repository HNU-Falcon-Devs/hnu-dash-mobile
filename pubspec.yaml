name: hnu_dash_mobile
description: HNU DASH attendance-scanning companion application.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  mobile_scanner: ^7.5.0
  path: ^1.9.1
  permission_handler: ^12.0.3
  sqflite: ^2.4.5
  sqlite3: ^3.9.0
  uuid: ^4.6.0
  supabase_flutter: ^2.18.3

dev_dependencies:
  http: ^1.6.0 # HTTP transport assertions for pinned RPC authentication.
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences: ^2.5.6

flutter:
  uses-material-design: true

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
